# 构建已签名的 Release APK；main 与 ci 平时只构建，只有手动 Release 才发版。
#
# 版本号规则：
#   推送 main / ci：只构建，versionName 不变，versionCode +1，产物上传 workflow artifact
#   手动 Release（Actions → Android APK → Run workflow，publish_release=true）：
#     versionName 末段 +1（到 9 进位中段，2.3.9 -> 2.4.0），versionCode +1，并发布 GitHub Release
#   ci 分支的 versionName 始终跟随 origin/main，且 ci 永不发版（tag 归 main 的正式发布）
#
# 触发方式：
#   - push 到 main 或 ci：自动构建，只上传 artifact
#   - workflow_dispatch：publish_release=true 时按发布处理（仅 main 有效），false 时等同一次普通构建
# 版本号回写提交会推回触发本次运行的分支。
#
# 需要的仓库 Secrets：
#   KEYSTORE_BASE64: release keystore 的 base64 内容
#   DICT_STORE_PASS: keystore 密码
#   DICT_KEY_PASS: key 密码，未设置时与 DICT_STORE_PASS 相同

name: Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish as a GitHub Release (bumps versionName; main only)
        required: true
        default: false
        type: boolean
      draft:
        description: Create the GitHub Release as a draft
        required: true
        default: false
        type: boolean
      key_alias:
        description: Alias of the signing key inside the keystore
        required: true
        default: ksm
        type: string
  push:
    branches: [main, ci]
    # 版本号回写只改 version.properties，不触发新的构建，避免自我循环。
    paths-ignore:
      - version.properties

permissions:
  contents: write

concurrency:
  group: Android-APK-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve publish mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.ref_name }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish_release }}
          INPUT_DRAFT: ${{ github.event.inputs.draft }}
          INPUT_KEY_ALIAS: ${{ github.event.inputs.key_alias }}
        run: |
          set -euo pipefail
          if [ "$BRANCH_NAME" = "ci" ]; then
            # ci 永远只构建：它的 versionName 跟随 main，tag 不能重复占用。
            PUBLISH=false
            DRAFT=false
            echo "ci branch: build only, no GitHub Release"
          elif [ "$EVENT_NAME" = "push" ]; then
            # main 的普通推送也只构建，发版必须手动触发。
            PUBLISH=false
            DRAFT=false
            echo "push event: build only, no GitHub Release"
          else
            # 手动 workflow_dispatch：按输入决定是否发版。
            PUBLISH="${INPUT_PUBLISH:-false}"
            DRAFT="${INPUT_DRAFT:-false}"
            echo "workflow_dispatch: publish=${PUBLISH} draft=${DRAFT}"
          fi
          KEY_ALIAS="${INPUT_KEY_ALIAS:-ksm}"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;37.0.0"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read and compute version
        id: version
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ steps.mode.outputs.publish }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # versionCode 始终以本分支的 version.properties 为基数递增。
          CURRENT_CODE="$(grep ^versionCode= version.properties | cut -d= -f2)"
          test -n "$CURRENT_CODE"
          LOCAL_NAME="$(grep ^versionName= version.properties | cut -d= -f2)"
          test -n "$LOCAL_NAME"

          if [ "$BRANCH_NAME" = "ci" ]; then
            # ci 的 versionName 只跟随 main：从远端 main 读取，忽略 ci 自己文件里的值。
            git fetch --depth=1 origin main
            BASE_NAME="$(git show origin/main:version.properties | grep ^versionName= | cut -d= -f2)"
            test -n "$BASE_NAME"
            echo "ci branch: versionName from origin/main = $BASE_NAME (ci file had $LOCAL_NAME)"
          else
            BASE_NAME="$LOCAL_NAME"
          fi

          # versionName 统一为三段式 MAJOR.MINOR.PATCH；两段式按 .0 补齐，如 2.1 -> 2.1.0。
          if ! printf '%s' "$BASE_NAME" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::versionName '$BASE_NAME' is not MAJOR.MINOR[.PATCH]"
            exit 1
          fi
          MAJOR="${BASE_NAME%%.*}"
          REST="${BASE_NAME#*.}"
          MINOR="${REST%%.*}"
          if [ "$REST" = "$MINOR" ]; then PATCH=0; else PATCH="${REST#*.}"; fi

          # 只有手动发布才递增 versionName；普通推送与 ci 构建都保持原样。
          if [ "$PUBLISH_RELEASE" = "true" ]; then
            if [ "$PATCH" -ge 9 ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            RELEASE_NAME="${MAJOR}.${MINOR}.${PATCH}"
            VERSION_MODE="release"
          else
            RELEASE_NAME="${MAJOR}.${MINOR}.${PATCH}"
            VERSION_MODE="build"
          fi
          # 无论哪种模式都递增 versionCode，否则同 code 的新包无法覆盖安装。
          RELEASE_CODE=$((CURRENT_CODE + 1))
          echo "name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$RELEASE_CODE" >> "$GITHUB_OUTPUT"
          echo "mode=$VERSION_MODE" >> "$GITHUB_OUTPUT"
          echo "${VERSION_MODE}: source=${BASE_NAME}/${CURRENT_CODE} -> ${RELEASE_NAME}/${RELEASE_CODE} (branch=${BRANCH_NAME})"

      - name: Refuse to reuse a released version
        if: ${{ steps.mode.outputs.publish == 'true' }}
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION_NAME}" >/dev/null; then
            echo "::error::Tag v${VERSION_NAME} already exists. Bump versionName in version.properties before releasing."
            exit 1
          fi

      - name: Build and sign release APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          DICT_STORE_PASS: ${{ secrets.DICT_STORE_PASS }}
          DICT_KEY_PASS: ${{ secrets.DICT_KEY_PASS }}
          DICT_KEY_ALIAS: ${{ steps.mode.outputs.key_alias }}
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/release-keystore.p12"
          trap 'rm -f "$KEYSTORE"' EXIT

          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 repository secret is not set}"
          : "${DICT_STORE_PASS:?DICT_STORE_PASS repository secret is not set}"
          : "${DICT_KEY_ALIAS:?key alias is empty}"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          export RELEASE_KEYSTORE_PATH="$KEYSTORE"
          export RELEASE_STORE_PASSWORD="$DICT_STORE_PASS"
          export RELEASE_KEY_ALIAS="$DICT_KEY_ALIAS"
          export RELEASE_KEY_PASSWORD="${DICT_KEY_PASS:-$DICT_STORE_PASS}"

          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK and write checksum
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          PUBLISH_RELEASE: ${{ steps.mode.outputs.publish }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          mkdir -p dist
          cp "$APK" "dist/kirakira-${VERSION_NAME}.apk"
          apksigner verify --verbose --print-certs "dist/kirakira-${VERSION_NAME}.apk" | tee "$RUNNER_TEMP/apksigner.txt"
          (cd dist && sha256sum "kirakira-${VERSION_NAME}.apk" > SHA256SUMS.txt)

          {
            echo "### Signed kirakira APK"
            echo
            echo "- Version: ${VERSION_NAME} (${VERSION_CODE})"
            echo "- Publish release: ${PUBLISH_RELEASE}"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/apksigner.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: ${{ steps.mode.outputs.publish != 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: kirakira-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            dist/kirakira-*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Commit version update
        id: bump
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_MODE: ${{ steps.version.outputs.mode }}
        run: |
          set -euo pipefail
          printf "versionCode=%s\nversionName=%s\n" "$VERSION_CODE" "$VERSION_NAME" > version.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore: ${VERSION_MODE} version ${VERSION_NAME} (${VERSION_CODE})"
          # 并发推送时先 rebase 再推，避免被 fetch first 拒绝。
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto latest ${GITHUB_REF_NAME}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "::error::Failed to push version update after 3 attempts"
          exit 1

      - name: Publish GitHub Release
        if: ${{ steps.mode.outputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          DRAFT: ${{ steps.mode.outputs.draft }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}"
          ARGS=(--title "kirakira-${VERSION_NAME}" --notes "Version: ${VERSION_NAME} (${VERSION_CODE})" --target "${{ steps.bump.outputs.commit }}")
          if [ "$DRAFT" = "true" ]; then
            ARGS+=(--draft)
          else
            ARGS+=(--latest)
          fi
          gh release create "$TAG" "dist/kirakira-${VERSION_NAME}.apk" "dist/SHA256SUMS.txt" "${ARGS[@]}"
