# 手动构建已签名的 Release APK。
#
# 需要的仓库 Secrets：
#   KEYSTORE_BASE64: release keystore 的 base64 内容
#   DICT_STORE_PASS: keystore 密码
#   DICT_KEY_PASS: key 密码，未设置时与 DICT_STORE_PASS 相同

name: Build signed APK

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: Alias of the signing key inside the keystore
        required: true
        default: ksm
        type: string

permissions:
  contents: read

concurrency:
  group: signed-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Refuse to reuse a released version
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION_NAME}" >/dev/null; then
            echo "::error::Tag v${VERSION_NAME} already exists. Bump versionCode and versionName before signing a new release."
            exit 1
          fi

      - name: Build and sign release APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          DICT_STORE_PASS: ${{ secrets.DICT_STORE_PASS }}
          DICT_KEY_PASS: ${{ secrets.DICT_KEY_PASS }}
          DICT_KEY_ALIAS: ${{ inputs.key_alias }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/release-keystore.p12"
          trap 'rm -f "$KEYSTORE"' EXIT

          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 repository secret is not set}"
          : "${DICT_STORE_PASS:?DICT_STORE_PASS repository secret is not set}"
          : "${DICT_KEY_ALIAS:?key_alias input is empty}"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          export RELEASE_KEYSTORE_PATH="$KEYSTORE"
          export RELEASE_STORE_PASSWORD="$DICT_STORE_PASS"
          export RELEASE_KEY_ALIAS="$DICT_KEY_ALIAS"
          export RELEASE_KEY_PASSWORD="${DICT_KEY_PASS:-$DICT_STORE_PASS}"

          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK and write checksum
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          mkdir -p dist
          cp "$APK" "dist/dict-${VERSION_NAME}.apk"
          apksigner verify --verbose --print-certs "dist/dict-${VERSION_NAME}.apk" | tee "$RUNNER_TEMP/apksigner.txt"
          (cd dist && sha256sum "dict-${VERSION_NAME}.apk" > SHA256SUMS.txt)

          {
            echo "### Signed dict APK"
            echo
            echo "- Version: ${VERSION_NAME} (${VERSION_CODE})"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/apksigner.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: dict-${{ steps.version.outputs.name }}-run-${{ github.run_number }}
          path: |
            dist/dict-${{ steps.version.outputs.name }}.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

