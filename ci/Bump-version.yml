# 每次推送到 main 时递增 versionCode，versionName 保持不变。
# 只改 version.properties，不构建 APK；APK 仍由 Android-APK.yml 手动触发。
name: Bump versionCode

on:
  push:
    branches: [main]
    paths-ignore:
      - version.properties

permissions:
  contents: write

concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # 跳过本工作流自己产生的提交，避免无限循环。
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Increment versionCode
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_CODE="$(grep ^versionCode= version.properties | cut -d= -f2)"
          CURRENT_NAME="$(grep ^versionName= version.properties | cut -d= -f2)"
          test -n "$CURRENT_CODE"
          test -n "$CURRENT_NAME"
          NEW_CODE=$((CURRENT_CODE + 1))
          printf 'versionCode=%s\nversionName=%s\n' "$NEW_CODE" "$CURRENT_NAME" > version.properties
          echo "code=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "versionCode: $CURRENT_CODE -> $NEW_CODE (versionName $CURRENT_NAME)"

      - name: Commit version bump
        shell: bash
        env:
          NEW_CODE: ${{ steps.bump.outputs.code }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore: bump versionCode to ${NEW_CODE} [skip ci]"
          git push origin HEAD:main
