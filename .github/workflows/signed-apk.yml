# 手动构建已签名的 Release APK，并可发布到 GitHub Release。
# versionName 保持源码值；versionCode 按源码发布，源码未更新时在上一发布基础上 +1。
#
# 启用方式：将本文件放到 .github/workflows/signed-apk.yml。
#
# 需要的仓库 Secrets：
#   KEYSTORE_BASE64: release keystore 的 base64 内容
#   DICT_STORE_PASS: keystore 密码
#   DICT_KEY_PASS: key 密码，未设置时与 DICT_STORE_PASS 相同

name: Release signed APK

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: Alias of the signing key inside the keystore
        required: true
        default: ksm
        type: string
      publish_release:
        description: Publish the signed APK as a GitHub Release
        required: true
        default: true
        type: boolean
      draft:
        description: Create the GitHub Release as a draft
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: signed-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;37.0.0"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep ^versionName= version.properties | cut -d= -f2)"
          SOURCE_CODE="$(grep ^versionCode= version.properties | cut -d= -f2)"
          test -n "$VERSION_NAME"
          test -n "$SOURCE_CODE"
          LAST_CODE=0
          while read -r tag; do
            case "$tag" in
              "v${VERSION_NAME}-"*)
                code="${tag#v${VERSION_NAME}-}"
                if [[ "$code" =~ ^[0-9]+$ ]] && [ "$code" -gt "$LAST_CODE" ]; then
                  LAST_CODE="$code"
                fi
                ;;
            esac
          done < <(git ls-remote --tags origin | awk -F'refs/tags/' '{print $2}' | sed 's/\^{}//')
          if [ "$SOURCE_CODE" -gt "$LAST_CODE" ]; then
            RELEASE_CODE="$SOURCE_CODE"
          else
            RELEASE_CODE=$((LAST_CODE + 1))
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$RELEASE_CODE" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION_NAME} (${RELEASE_CODE}) [source versionCode=${SOURCE_CODE}, last release=${LAST_CODE}]"
      - name: Refuse to reuse a released version
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION_NAME}-${VERSION_CODE}" >/dev/null; then
            echo "::error::Tag v${VERSION_NAME}-${VERSION_CODE} already exists."
            exit 1
          fi

      - name: Build and sign release APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          DICT_STORE_PASS: ${{ secrets.DICT_STORE_PASS }}
          DICT_KEY_PASS: ${{ secrets.DICT_KEY_PASS }}
          DICT_KEY_ALIAS: ${{ inputs.key_alias }}
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/release-keystore.p12"
          trap 'rm -f "$KEYSTORE"' EXIT

          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 repository secret is not set}"
          : "${DICT_STORE_PASS:?DICT_STORE_PASS repository secret is not set}"
          : "${DICT_KEY_ALIAS:?key_alias input is empty}"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          export RELEASE_KEYSTORE_PATH="$KEYSTORE"
          export RELEASE_STORE_PASSWORD="$DICT_STORE_PASS"
          export RELEASE_KEY_ALIAS="$DICT_KEY_ALIAS"
          export RELEASE_KEY_PASSWORD="${DICT_KEY_PASS:-$DICT_STORE_PASS}"

          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK and write checksum
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          mkdir -p dist
          cp "$APK" "dist/kirakira-${VERSION_NAME}-${VERSION_CODE}.apk"
          apksigner verify --verbose --print-certs "dist/kirakira-${VERSION_NAME}-${VERSION_CODE}.apk" | tee "$RUNNER_TEMP/apksigner.txt"
          (cd dist && sha256sum "kirakira-${VERSION_NAME}-${VERSION_CODE}.apk" > SHA256SUMS.txt)

          {
            echo "### Signed kirakira APK"
            echo
            echo "- Version: ${VERSION_NAME} (${VERSION_CODE})"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/apksigner.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}-${VERSION_CODE}"
          ARGS=(--title "kirakira" --notes "Version: ${VERSION_NAME} (${VERSION_CODE})" --target "$GITHUB_SHA")
          if [ "$DRAFT" = "true" ]; then
            ARGS+=(--draft)
          else
            ARGS+=(--latest)
          fi
          gh release create "$TAG" "dist/kirakira-${VERSION_NAME}-${VERSION_CODE}.apk" "dist/SHA256SUMS.txt" "${ARGS[@]}"
